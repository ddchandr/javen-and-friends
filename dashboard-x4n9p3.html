<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Apartment Strings</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec;
    --ink: #1a1714;
    --muted: #8a8580;
    --border: #d8d3cb;
    --surface: #ffffff;
    --green: #2d6a4f;
    --green-bg: #e8f5ee;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --blue: #1e40af;
    --blue-bg: #eff6ff;
    --red: #9b1c1c;
    --red-bg: #fef2f2;
    --f-mono: 'DM Mono', monospace;
    --f-sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-sans);
    font-size: 13px;
    padding: 48px 32px;
    min-height: 100vh;
  }

  .page { max-width: 1100px; margin: 0 auto; }

  /* Header */
  .hdr {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 36px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--ink);
  }
  .hdr-title {
    font-family: var(--f-mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .hdr h1 {
    font-family: var(--f-sans);
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: -0.03em;
  }
  .hdr-date {
    font-family: var(--f-mono);
    font-size: 0.65rem;
    color: var(--muted);
  }

  /* Top stat row */
  .top-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .top-stat {
    background: var(--surface);
    padding: 20px 22px;
  }
  .top-stat-label {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .top-stat-val {
    font-family: var(--f-mono);
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.04em;
    color: var(--green);
  }
  .top-stat-sub {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Main grid */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-title {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .card-badge {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 0.06em;
  }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-blue  { background: var(--blue-bg);  color: var(--blue);  }

  /* Stat rows inside cards */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 18px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row-label {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .stat-row-val {
    font-family: var(--f-mono);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .val-green { color: var(--green); }
  .val-amber { color: var(--amber); }
  .val-blue  { color: var(--blue);  }
  .val-red   { color: var(--red);   }

  /* Progress bar */
  .progress-wrap { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    margin-bottom: 7px;
    font-family: var(--f-mono);
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.6s ease;
  }
  .progress-fill.amber { background: var(--amber); }

  /* Projections */
  .proj-card { margin-bottom: 24px; }
  .proj-table {
    width: 100%;
    border-collapse: collapse;
  }
  .proj-table th {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 400;
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  .proj-table th:first-child { text-align: left; }
  .proj-table td {
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    font-family: var(--f-mono);
    font-size: 0.78rem;
  }
  .proj-table td:first-child { text-align: left; font-family: var(--f-sans); font-size: 0.75rem; color: var(--muted); }
  .proj-table tr:last-child td { border-bottom: none; }
  .proj-table tr:hover td { background: var(--bg); }
  .highlight { color: var(--green); font-weight: 500; }
  .proj-table .current-col { background: rgba(45,106,79,0.05); }

  /* Attendees */
  .attendee-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .attendee-list { padding: 0; }
  .attendee-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
  }
  .attendee-item:last-child { border-bottom: none; }
  .attendee-num {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    color: var(--muted);
    width: 18px;
    flex-shrink: 0;
  }

  /* Full width */
  .full { grid-column: 1 / -1; }

  /* Section label */
  .section-label {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .refresh-btn {
    font-family: var(--f-mono);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .refresh-btn:hover { border-color: var(--ink); color: var(--ink); }

  .loading {
    text-align: center;
    padding: 80px 0;
    font-family: var(--f-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .loading span { animation: pulse 1.2s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  .error-msg {
    background: var(--red-bg);
    border: 1px solid rgba(155,28,28,0.2);
    border-radius: 8px;
    padding: 16px 20px;
    color: var(--red);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <div>
      <div class="hdr-title">Apartment Strings — Revenue Report</div>
      <h1>Concert Season Overview</h1>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="hdr-date" id="last-updated">Loading...</div>
      <button class="refresh-btn" onclick="loadData()">↺ Refresh</button>
    </div>
  </div>

  <div id="content"><div class="loading"><span>Fetching live data...</span></div></div>

</div>

<script>
const MEMBERS = ['Alissa','Alyssa','Gigi','Dharsh','Javen','Emma'];
const CAPACITIES = { 'es_2086377': 22, 'es_2086909': 30 };
const TICKET_PRICE = 20;

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading"><span>Fetching live data...</span></div>';
  try {
    const res = await fetch('/.netlify/functions/dashboard-data');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render(data);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="error-msg">⚠ Could not load data. Make sure dashboard-data.js is deployed in netlify/functions/. Error: ${e.message}</div>`;
  }
}

function fmt(cents) { return '$' + (cents/100).toFixed(2); }
function fmtD(n) { return '$' + n.toFixed(2); }

function render(data) {
  // Aggregate per event
  const events = data.map(({ event, series, orders }) => {
    const cap = CAPACITIES[event.seriesId] || event.capacity;
    const tt = series.default_ticket_types?.[0];
    const issued = tt?.quantity_issued ?? 0;
    const remaining = cap - issued;
    const complete = orders.filter(o => o.status === 'complete');
    const revenue = complete.reduce((s,o) => s + (o.total||0), 0);
    const paid = complete.filter(o => (o.total||0) > 0);
    const free = complete.filter(o => (o.total||0) === 0);
    const attendees = complete.map(o => ({
      name: o.buyer_details ? `${o.buyer_details.first_name||''} ${o.buyer_details.last_name||''}`.trim() : '—',
      email: o.buyer_details?.email || '—',
      qty: o.quantities?.total || 1,
      paid: (o.total||0) > 0,
      amount: (o.total||0)/100,
      date: o.created_at ? new Date(o.created_at*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—'
    }));
    return { event, cap, issued, remaining, revenue, paid, free, attendees };
  });

  const totalRevenue = events.reduce((s,e) => s + e.revenue, 0) / 100;
  const totalSold = events.reduce((s,e) => s + e.issued, 0);
  const totalCap = events.reduce((s,e) => s + e.cap, 0);
  const totalPaid = events.reduce((s,e) => s + e.paid.length, 0);
  const totalFree = events.reduce((s,e) => s + e.free.length, 0);
  const totalRemaining = events.reduce((s,e) => s + e.remaining, 0);
  const maxRevenue = totalRevenue + (totalRemaining * TICKET_PRICE);

  // Build projection cols dynamically based on remaining
  const compOptions = [0, 4, 6, 8].filter(c => c <= totalRemaining);

  document.getElementById('content').innerHTML = `

    <!-- Top stats -->
    <div class="top-stats">
      <div class="top-stat">
        <div class="top-stat-label">Total Revenue</div>
        <div class="top-stat-val">${fmtD(totalRevenue)}</div>
        <div class="top-stat-sub">${fmtD(totalRevenue/MEMBERS.length)} per person</div>
      </div>
      <div class="top-stat">
        <div class="top-stat-label">Tickets Sold</div>
        <div class="top-stat-val">${totalSold}</div>
        <div class="top-stat-sub">${totalPaid} paid · ${totalFree} free · ${totalRemaining} remaining of ${totalCap}</div>
      </div>
      <div class="top-stat">
        <div class="top-stat-label">Max Potential</div>
        <div class="top-stat-val">${fmtD(maxRevenue)}</div>
        <div class="top-stat-sub">If all ${totalRemaining} remaining sell at $${TICKET_PRICE}</div>
      </div>
    </div>

    <!-- Event cards -->
    <div class="main-grid">${events.map(e => renderEventCard(e)).join('')}</div>

    <!-- Projections -->
    <div class="section-label">Revenue Projections — ${totalRemaining} Seats Remaining</div>
    <div class="card proj-card">${renderProjections(events, totalRevenue, totalRemaining, compOptions)}</div>

    <!-- Attendees -->
    <div class="section-label">Attendees</div>
    <div class="attendee-grid">${events.map(e => renderAttendees(e)).join('')}</div>

    <!-- Orders -->
    <div class="section-label">All Orders</div>
    <div class="card">${renderOrders(events)}</div>
  `;
}

function renderEventCard(e) {
  const pct = Math.round((e.issued / e.cap) * 100);
  const revenueD = e.revenue / 100;
  const badgeClass = e.remaining === 0 ? 'badge-green' : 'badge-amber';
  const badgeText = e.remaining === 0 ? 'SOLD OUT' : `${e.remaining} REMAINING`;
  const barClass = e.remaining === 0 ? '' : 'amber';
  return `
    <div>
      <div class="section-label">${e.event.name}</div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">${e.event.name}</span>
          <span class="card-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-label"><span>Capacity</span><span>${e.issued} / ${e.cap}</span></div>
          <div class="progress-track"><div class="progress-fill ${barClass}" style="width:${pct}%"></div></div>
        </div>
        <div class="stat-row"><span class="stat-row-label">Revenue</span><span class="stat-row-val val-green">${fmtD(revenueD)}</span></div>
        <div class="stat-row"><span class="stat-row-label">Paid tickets</span><span class="stat-row-val">${e.paid.length}</span></div>
        <div class="stat-row"><span class="stat-row-label">Comp tickets</span><span class="stat-row-val val-amber">${e.free.length}</span></div>
        <div class="stat-row"><span class="stat-row-label">Remaining</span><span class="stat-row-val ${e.remaining===0?'val-red':'val-blue'}">${e.remaining}</span></div>
        <div class="stat-row"><span class="stat-row-label">Per person (6)</span><span class="stat-row-val val-green">${fmtD(revenueD/MEMBERS.length)}</span></div>
      </div>
    </div>`;
}

function renderProjections(events, currentRevenue, totalRemaining, compOptions) {
  const cols = compOptions.map(comps => {
    const paidSold = Math.max(0, totalRemaining - comps);
    const projRevenue = currentRevenue + (paidSold * TICKET_PRICE);
    const perPerson = projRevenue / MEMBERS.length;
    return { comps, paidSold, projRevenue, perPerson };
  });

  const headers = cols.map(c => `<th>${c.comps} Comps</th>`).join('');
  const paidRow = cols.map(c => `<td>${c.paidSold}</td>`).join('');
  const revRow = cols.map(c => `<td class="highlight">${fmtD(c.projRevenue)}</td>`).join('');
  const perRow = cols.map(c => `<td>${fmtD(c.perPerson)}</td>`).join('');
  const memberRows = MEMBERS.map(m =>
    `<tr><td>${m}</td>${cols.map(c => `<td>${fmtD(c.perPerson)}</td>`).join('')}</tr>`
  ).join('');

  return `<table class="proj-table">
    <thead><tr><th>Scenario</th>${headers}</tr></thead>
    <tbody>
      <tr><td>Paid seats sold</td>${paidRow}</tr>
      <tr><td>Total Revenue</td>${revRow}</tr>
      <tr><td>Per person share</td>${perRow}</tr>
      ${memberRows}
    </tbody>
  </table>`;
}

function renderAttendees(e) {
  const badgeClass = e.remaining === 0 ? 'badge-green' : 'badge-amber';
  const rows = e.attendees.map((a,i) =>
    `<div class="attendee-item"><span class="attendee-num">${i+1}</span>${a.name}</div>`
  ).join('') || '<div class="attendee-item" style="color:var(--muted)">No attendees yet</div>';
  return `
    <div class="card">
      <div class="card-header">
        <span class="card-title">${e.event.name}</span>
        <span class="card-badge ${badgeClass}">${e.attendees.length} attendees</span>
      </div>
      <div class="attendee-list">${rows}</div>
    </div>`;
}

function renderOrders(events) {
  const all = events.flatMap(e =>
    e.attendees.map(a => ({ ...a, eventName: e.event.name }))
  );
  if (!all.length) return '<div style="padding:24px;text-align:center;color:var(--muted)">No orders yet</div>';
  const rows = all.map(a => `
    <tr>
      <td>${a.name}</td>
      <td style="color:var(--muted)">${a.email}</td>
      <td style="color:var(--muted)">${a.eventName}</td>
      <td>${a.qty}</td>
      <td><span class="card-badge ${a.paid?'badge-green':'badge-amber'}">${a.paid?'PAID':'COMP'}</span></td>
      <td style="color:${a.paid?'var(--green)':'var(--muted)'}">${fmtD(a.amount)}</td>
      <td style="color:var(--muted)">${a.date}</td>
    </tr>`).join('');
  return `<table class="proj-table">
    <thead><tr><th style="text-align:left">Name</th><th style="text-align:left">Email</th><th style="text-align:left">Event</th><th>Qty</th><th>Status</th><th>Amount</th><th>Date</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

loadData();
</script>
</body>
</html>
